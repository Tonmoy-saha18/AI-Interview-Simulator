[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-service"
version = "0.1.0"
description = "Sandboxed code execution service for InterviewIQ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.24.0",
    "docker>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
