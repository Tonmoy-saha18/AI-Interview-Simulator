[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-bot"
version = "0.1.0"
description = "Interview simulation bot built with LangGraph nodes for question generation, answer evaluation, and feedback."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.59",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
]
authors = [
    { name = "AI Interview Simulator", email = "oss@example.com" }
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
